# Local development databases. Production uses Neo4j AuraDB Free + Qdrant Cloud.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: paperweave-neo4j
    ports:
      - "7474:7474" # browser UI: http://localhost:7474
      - "7687:7687" # bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-paperweave-dev}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: paperweave-qdrant
    ports:
      - "6333:6333" # REST + dashboard: http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

  # Optional: run the API in Docker too (`docker compose --profile backend up -d --build`).
  # Without it, run `uvicorn app.main:app --reload` from backend/.
  backend:
    profiles: [backend]
    build:
      context: ./backend
      args:
        LOCAL_EMBED: "true"
    container_name: paperweave-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://host.docker.internal:11434
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  neo4j_data:
  qdrant_storage:

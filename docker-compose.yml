# Local development databases. Production uses Neo4j AuraDB Free + Qdrant Cloud.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: paperweave-neo4j
    ports:
      - "7474:7474" # browser UI: http://localhost:7474
      - "7687:7687" # bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-paperweave-dev}
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: paperweave-qdrant
    ports:
      - "6333:6333" # REST + dashboard: http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  neo4j_data:
  qdrant_storage:

# Render Blueprint for the PaperWeave API (free web service, Docker).
# Render dashboard -> New -> Blueprint -> pick this repo. Secrets marked sync: false are
# entered in the dashboard, never committed. See docs/DEPLOY.md.
services:
  - type: web
    name: paperweave-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NEO4J_URI
        sync: false # neo4j+s://xxxx.databases.neo4j.io
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: QDRANT_URL
        sync: false # https://xxxx.cloud.qdrant.io
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_CLOUD_INFERENCE
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # https://your-app.vercel.app
      - key: RATE_LIMIT_PER_HOUR
        value: "15"
